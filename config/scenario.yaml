# What the client does, decided in advance and committed before it runs.
#
# WHY THIS FILE EXISTS AND WHY IT IS DATED
# ----------------------------------------
# The agent's whole claim is that it never takes a view on where the market is
# going. A demonstration whose client actions were chosen day by day, as the
# market moved, would quietly break that claim -- shares sold the morning
# before a fall would look like a forecast whatever the code did, and there
# would be no way to prove otherwise after the fact.
#
# So every action below is fixed before the first cycle runs and committed to
# git. The commit timestamp is the evidence. If the agent behaves badly on day
# three, the scenario cannot be quietly adjusted to make it look better.
#
# Nothing here is simulated. The market is real, the account is real, the
# orders are real. The only thing scripted is what the client asks for -- which
# is the one thing a client actually does.
#
# WHAT IT IS MEANT TO SHOW
# -------------------------
# Track 03 asks for agents that know when to step in, how much protection to
# buy, and when to release a hedge no longer needed. Those are three different
# events and none of them is triggered by the market, so a week of ordinary
# price action would demonstrate at most the first. The client moving their own
# money is what produces the other two.
#
# The days with no action are not filler. An agent that does nothing while
# prices move is the claim being tested, and it can only be shown by leaving it
# alone and letting the journal record the silence.

recorded: 2026-08-27
account: PA3JMHDY9BSC
mandate: balanced

days:
  - day: 1
    date: 2026-08-28
    client_action: none
    expect: >
      The book is equity only. Measured down the whole descent the promise is
      broken by roughly 72,000, and at the published -20% rung by 6,400. The
      agent should solve for a strike on each sleeve, buy protection dated past
      the twelve month horizon, and journal what it cost. This is "when to step
      in".

  - day: 2
    date: 2026-08-31
    client_action: none
    expect: >
      The client does nothing, and the agent finishes what day one started.

      Day one's orders were limits at the ask and the ask moved while the cycle
      was still running, so they expired unfilled over the weekend -- recorded
      as `order.working`, not as a purchase. Nothing was lost and nothing was
      bought. Monday's cycle measures the same uncovered risk, prices it on
      Monday's chain, and sends again with a limit that reaches a quarter of
      the spread past the offer.

      That is the honest shape of the thing: the promise is not held by one
      order landing, it is held by the same question being asked every morning
      until the answer is yes.

  - day: 3
    date: 2026-09-01
    client_action: none
    expect: >
      Nothing. The promise is held, the book has not changed, and prices moving
      is not a reason to trade. A cycle that finds something to do here would be
      an agent looking for a reason.

      This day is the claim being tested. An agent that traded on a quiet
      Tuesday would be an agent that trades because it is running, and every
      number it reported afterwards would have to be read in that light.

  - day: 4
    date: 2026-09-02
    client_action: sell_equity
    detail:
      symbol: XLF
      shares: 900
    expect: >
      The client leaves the sector entirely. Exposure falls by roughly 52,000,
      and the nine puts standing behind it now stand behind nothing at all, so
      every one of them goes back. This is "when to release a hedge that is no
      longer needed", and the trigger is the client's own decision rather than
      anything the market did.

      The whole position rather than part of it, deliberately. A partial sale
      would release some contracts and keep others, which is the same act in a
      quieter form; selling out makes the handback the entire hedge on that
      symbol and there is no ambiguity about what the journal should say.

      Moved here from day three so that the quiet day sits between the purchase
      and the release. Buying protection on Monday and handing part of it back
      on Tuesday is defensible -- the client moved, not the agent -- but it
      reads as churn, and the day of deliberate silence is the more honest
      demonstration.

  - day: 5
    date: 2026-09-03
    client_action: buy_equity
    detail:
      symbol: AAPL
      shares: 100
    expect: >
      The client puts part of the cash raised on day three back into the
      market, in a single stock rather than an index: 100 shares of AAPL at
      roughly 315, about 31,000. Exposure rises, the same promise now stands
      behind a larger book, and the floor has to be re-struck -- the agent
      should buy protection on the new holding.

      This is "hedge rebalancing", and it is the half most overlays never do.
      Adding protection when a client invests is unglamorous and it is the
      whole job: a hedge sized once and left alone stops being a hedge the
      first time the portfolio changes underneath it.

      A single stock rather than a fourth index, deliberately. AAPL carries its
      own risk and its own price for insuring it -- around 29% implied
      volatility against roughly 22% on an index -- so protecting it costs
      visibly more per dollar protected, and the journal will say so.

      It is also the clearest case for hedging each holding on its own
      underlying. An IWM put pays on IWM; nothing about it responds to an
      earnings miss at one company. The agent buys AAPL puts against AAPL
      shares, which needs no correlation assumption at all.

      A hundred shares exactly, because a contract covers a hundred and nothing
      smaller. Ten shares of AAPL could only be hedged by a contract standing
      behind ten times the position, which is not protection but a bet on the
      price falling.

  - day: 6
    date: 2026-09-04
    client_action: none
    expect: >
      Final state. Whatever the market did across the week, the client's worst
      case should sit inside the budget they named on day one.

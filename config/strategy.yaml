# What the agent watches, and whose promise it is keeping.
#
# Two keys, because two are all that are read. This file used to carry a delta
# band per regime, a days-to-expiry window, a size multiplier and a roll
# policy: the settings of an options wheel that sold premium for income. None
# of them described protection, and the days-to-expiry window in particular did
# real damage before it was removed -- it was calibrated against the option
# history on disk for a backtest, and left in charge of the live agent it
# bought 22-day puts to hold up a twelve-month promise.
#
# How long protection must last is not a strategy setting. It follows from what
# the client was promised, so it lives in `mandates.yaml` as `horizon_months`
# and the expiry window is derived from it.

# The equity ETFs whose shocks the ladder measures.
universe: [SPY, QQQ, IWM]

# Which client this account is run for. The mandate carries the downside budget
# the stress ladder is measured against, so changing this one word changes what
# the agent considers an acceptable loss -- and `load_mandate` refuses any
# profile that would be looser than config/risk.yaml.
mandate: balanced

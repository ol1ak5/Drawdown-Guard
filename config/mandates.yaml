# Client mandates: what the portfolio is allowed to want.
#
# A mandate is a promise, not a preference. Every field here is checked before
# an order is sent and audited after the cycle, so a profile that says
# "conservative" has to mean something a machine can verify.
#
# TWO CONSTITUTIONS
# -----------------
# `risk.yaml` is the permanent one. It never changes, no mandate may loosen it,
# and `forbid_naked` in particular has no override anywhere in the system. What
# follows is the temporary constitution: it may be stricter than the permanent
# one, never weaker. `load_mandate` enforces that and refuses to construct a
# mandate that tries.
#
# THE DOWNSIDE BUDGET IS THE ONE PROMISE ABOUT LOSSES
# ----------------------------------------------------
# Every other field here limits what may be *opened*. `downside_budget_pct`
# limits what the book already held would *cost* if the market fell, which no
# single order can keep or break by itself. It is checked every cycle by
# `risk/stress.py`, against the positions that actually exist, and the shortfall
# it reports is what the agent is hired to close.
#
# THE CONCENTRATION CAPS ARE NOT ROUND NUMBERS PICKED FOR LOOKS
# -------------------------------------------------------------
# Measured 2026-08-25 on cached history. The equity ETFs correlate 0.78 to 0.95
# with each other, so an all-equity book reports 100% of variance contribution
# in one bucket. TLT correlates +0.09 to +0.17 with them, but carries much less
# volatility, so ten TLT contracts against two SPY and two QQQ still leave
# equity at 94.4%.
#
# A cap of 50% would therefore be unreachable and would silence the agent
# entirely -- exactly what `max_net_delta: 150` did to the wheel for two and a
# half years before it was found. These caps are set where the measurement says
# a book can actually live, and `scripts/calibrate_limits.py` is how they get
# revisited rather than guessed.

conservative:
  description: >
    Income is optional. Capital preservation is not. Expect this mandate to
    refuse most cycles, and expect refusal to be the normal outcome rather
    than a fault.
  universe: [SPY, TLT]
  max_deployed_pct: 30.0
  target_delta: {min: 0.10, max: 0.20}
  # Reachable only with a materially rates-weighted book. That is the point:
  # the cap is what forces the diversification rather than suggesting it.
  max_concentration_pct: 75.0
  stress_allows_new_risk: false
  # 5% of the account. Under a 20% equity shock this permits an unprotected
  # exposure of only a quarter of capital, so this mandate is nearly always in
  # deficit and nearly always buying protection. That is what conservative
  # means once it is written as arithmetic instead of as a word.
  downside_budget_pct: 5.0

balanced:
  description: >
    Generate income while keeping the risk being sold from collapsing into a
    single factor.
  universe: [SPY, QQQ, IWM, TLT]
  max_deployed_pct: 60.0
  target_delta: {min: 0.15, max: 0.30}
  max_concentration_pct: 90.0
  stress_allows_new_risk: false
  # 10%. On a 1,000,000 account that is 100,000, and a 20% shock keeps the
  # promise unprotected up to 500,000 of exposure. The demonstration book is
  # deliberately sized above that line -- see scripts/build_portfolio.py.
  downside_budget_pct: 10.0

aggressive:
  description: >
    Maximise income inside a concentrated risk budget. This mandate does not
    pretend to be diversified; it declares that it is not.
  universe: [QQQ, IWM, SPY]
  # 60, not the 85 first written here. The permanent constitution caps
  # deployment at 60% and `Mandate.validate_against` refused to build this
  # mandate at 85 -- correctly. Raising the permanent cap to fit a client
  # profile would invert the relationship and there would be nothing
  # permanent left. This is as aggressive as the constitution allows.
  max_deployed_pct: 60.0
  target_delta: {min: 0.20, max: 0.40}
  # No concentration constraint in practice. Stated at 100 rather than omitted,
  # so the audit reports "declared concentrated and behaved concentrated"
  # instead of "no opinion".
  max_concentration_pct: 100.0
  stress_allows_new_risk: true
  # 15%, which is the ceiling rather than a choice. The permanent kill-switch
  # halts the agent at a 15% drawdown, so a larger budget would be a promise
  # the system stops trading before it could ever honour. `validate_against`
  # refuses to construct it, which is the correct outcome: an unkeepable
  # promise should fail loudly at load time, not quietly in a crash.
  downside_budget_pct: 15.0

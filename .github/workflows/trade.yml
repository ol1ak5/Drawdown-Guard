name: trade

on:
  schedule:
    # Every half hour while the market is open, and the frequency is the
    # design rather than caution.
    #
    # A cycle that ran once a morning could not see a client selling at 15:55,
    # and no schedule can: the option market shuts at 16:00 with the stock
    # market, so an action in the last minutes is unhedgeable by anyone. What
    # the frequency buys is a smaller window -- a change is found within half
    # an hour, with time left to trade it -- and a record of the times it was
    # found too late to act on.
    #
    # Every one of these is a full cycle, analyst included. Prices move between
    # readings even when the book does not, so a strike that was 7% out of the
    # money at the open is 8% out of it by midday and the ladder is measured
    # again each time; there is something new to read every half hour. What
    # does not repeat is the buying: `protect` runs on `uncovered_risk`, and
    # an order already live at the broker is recognised and not sent twice.
    #
    # GitHub's cron is also a request rather than a promise -- the 14:00
    # booking arrived at 23:24 on 2026-08-28 -- so thirteen attempts are
    # additionally thirteen chances for one of them to be on time. The
    # Cloudflare worker in `scheduler/` presses the first one punctually.
    #
    # 13:45 UTC = 09:45 ET, fifteen minutes after the open; 19:45 UTC = 15:45
    # ET, fifteen minutes before the close. Correct for EDT, in force through
    # 2026-11-01. Shift both by an hour under EST.
    - cron: "45 13 * * 1-5"
    - cron: "15,45 14-19 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Decide and journal, but submit no orders"
        type: boolean
        default: false

concurrency:
  # Never two cycles at once. Both would read the same account, both would
  # decide against the same free capital, and both would size as if the other
  # had not traded.
  group: trade
  cancel-in-progress: false

jobs:
  cycle:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - run: uv sync --frozen

      # Three outcomes, not two. Exit 2 means "declined for a normal reason"
      # -- market shut, half day, HALT file -- and must leave the job green.
      # A red run every weekend trains everyone to ignore the mail, and the one
      # notification that matters then lands in a folder nobody opens.
      - name: Healthcheck
        id: preflight
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_PAPER_TRADE: "true"
          # Falls back rather than passing an empty string: the variable was
          # renamed with the project on 2026-08-27, and a repository variable
          # that does not exist yet would otherwise fail settings validation
          # and halt a cycle for a reason that has nothing to do with risk.
          DRAWDOWNGUARD_ENV: ${{ vars.DRAWDOWNGUARD_ENV || 'dev' }}
        run: |
          set +e
          uv run python3 scripts/healthcheck.py
          code=$?
          set -e
          if [ "$code" -eq 2 ]; then
            echo "trade=false" >> "$GITHUB_OUTPUT"
            echo "::notice::declined for a normal reason; skipping the cycle"
            exit 0
          fi
          echo "trade=true" >> "$GITHUB_OUTPUT"
          exit $code

      - name: Run one trading cycle
        if: steps.preflight.outputs.trade == 'true'
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          ALPACA_PAPER_TRADE: "true"
          DRAWDOWNGUARD_ENV: ${{ vars.DRAWDOWNGUARD_ENV || 'dev' }}
        # Scheduled runs always trade. Only a hand-triggered run can ask for
        # a dry run, and it has to ask explicitly -- a default that silently
        # stopped submitting would be an agent that looks alive and does
        # nothing, which is the failure mode hardest to notice.
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            uv run python3 scripts/run_cycle.py --dry-run
          else
            uv run python3 scripts/run_cycle.py
          fi

      # The published page is generated from the journal, and this step was
      # missing: `docs/index.html` only ever changed when somebody rebuilt it
      # by hand. The live URL would have frozen on whatever was last committed
      # while the agent went on trading behind it -- a status page that is
      # confidently out of date is worse than no status page, because a reader
      # cannot tell.
      #
      # `always()` for the same reason the commit below has it: a cycle that
      # died still journalled why, and the page should say so.
      - name: Rebuild the status page
        if: always()
        run: uv run python3 scripts/build_site.py

      # `always()` so a failed cycle still commits whatever it journalled
      # before it died. The record of a crash is the most valuable record
      # there is, and it is the one a conditional step would throw away.
      - name: Commit the journal and the page
        if: always()
        run: |
          git config user.name "drawdown-guard-agent"
          git config user.email "agent@users.noreply.github.com"
          # The directories may not exist on a first run, and `bash -e`
          # turns a git pathspec error into a failed job. Create them
          # first: a missing journal is not a reason to report the cycle
          # as broken.
          mkdir -p journal data/state data/iv_history
          git add journal data/state data/iv_history docs/index.html
          git diff --staged --quiet || git commit -m "journal: cycle $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push

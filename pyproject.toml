[project]
name = "flywheel"
version = "0.1.0"
description = "Autonomous ETF wheel overlay agent on Alpaca paper trading"
readme = "README.md"
authors = [
    { name = "Olya", email = "ol2ksenova@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "alpaca-py>=0.44.0",
    "cvxpy>=1.9.2",
    "highspy>=1.15.1",
    "langchain>=1.0",
    "langchain-anthropic>=1.6.1",
    "langgraph>=1.2.11",
    "matplotlib>=3.11.1",
    "mcp>=2.0.0",
    "numpy>=2.4.6",
    "pandas>=3.0.5",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "scipy>=1.17.1",
    "structlog>=26.1.0",
    "yfinance>=1.6.0",
]

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true

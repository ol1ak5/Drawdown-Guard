[project]
name = "drawdownguard"
version = "0.1.0"
description = "Autonomous ETF wheel overlay agent on Alpaca paper trading"
readme = "README.md"
authors = [
    { name = "Olya", email = "ol2ksenova@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "alpaca-mcp-server>=2.2.1",
    "alpaca-py>=0.44.0",
    "cvxpy>=1.9.2",
    "highspy>=1.15.1",
    "langchain>=1.0",
    "langchain-google-genai>=4.3.5",
    "langgraph>=1.2.11",
    "matplotlib>=3.11.1",
    # Capped below 2.0 by alpaca-mcp-server, which reaches mcp through fastmcp;
    # fastmcp-slim pins mcp<2.0. Raising this floor uninstalls the MCP server.
    "mcp>=1.24.0,<2.0",
    "numpy>=2.4.6",
    "pandas>=3.0.5",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "scipy>=1.17.1",
    "structlog>=26.1.0",
    "yfinance>=1.6.0",
]

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: needs live Alpaca credentials and a running MCP server",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
